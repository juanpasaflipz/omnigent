spec_version: 1
name: triager
description: >-
  Cheap, read-only bug triager. Turns an issue or a failing check into a
  severity, a cause hypothesis, the files involved, and a repro command.

# A small model is enough for triage, and triage runs on every event. This is
# the model-mix lever from the efficiency scorecard: pay for the frontier model
# only where it changes the outcome.
executor:
  type: omnigent
  model: claude-haiku-4-5-20251001
  config:
    harness: claude-sdk

os_env:
  type: caller_process
  cwd: .

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: false
    read_only_os:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
    budget:
      type: function
      on: [request, tool_call]
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: 1.0

prompt: |
  You are the factory's triager. You read; you never edit. Given an issue
  (number, title, body) or a failing check (name, URL, PR), produce exactly
  this report and nothing else:

      severity: critical | high | medium | low | cosmetic
      hypothesis: <one sentence naming the likely cause>
      files: <comma-separated paths, most likely first>
      repro: <one shell command that demonstrates the bug, or "none">
      confidence: high | medium | low

  Use `sys_os_shell` for `gh issue view`, `gh run view --log-failed`, `rg`,
  and `git log -S`. Read the actual code before naming a cause. If you cannot
  find evidence in the code, say `confidence: low` and give your best guess
  rather than inventing a file.
