# Railway config for the flywheel distribution. Railway builds the fork from
# source with deploy/docker/Dockerfile: its web-builder stage compiles the web
# UI, and the final `runtime` stage is the server. Pair with a Railway Postgres
# service and set DATABASE_URL = ${{Postgres.DATABASE_URL}} on this service.
# Setup and the deploy button: deploy/railway/README.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
